[tox]
minversion = 4.0.0
envlist = pep8,py3

[testenv]
usedevelop = True
setenv =
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
deps =
   -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
   -r{toxinidir}/requirements.txt
   -r{toxinidir}/test-requirements.txt
commands =
  stestr run {posargs}
passenv =
  OS_DEBUG
  GENERATE_HASHES

[testenv:genconfig]
commands = oslo-config-generator --config-file=etc/masakarimonitors/masakarimonitors-config-generator.conf

[testenv:pep8]
skip_install = True
deps =
  pre-commit
commands =
  pre-commit run -a

[testenv:doc8]
skip_install = True
deps =
  {[testenv:pep8]deps}
commands =
  pre-commit run -a doc8

[testenv:yamllint]
skip_install = True
deps =
  {[testenv:pep8]deps}
commands =
  pre-commit run -a yamllint

[testenv:venv]
commands = {posargs}

[testenv:cover]
setenv =
    PYTHON=coverage run --source masakarimonitors --parallel-mode
commands =
    stestr run {posargs}
    coverage combine
    coverage html -d cover
    coverage xml -o cover/coverage.xml

[testenv:docs]
deps =
   -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
   -r{toxinidir}/requirements.txt
   -r{toxinidir}/doc/requirements.txt
commands = sphinx-build -W -b html doc/source doc/build/html

[testenv:pdf-docs]
deps = {[testenv:docs]deps}
allowlist_externals =
  make
commands =
  sphinx-build -W -b latex doc/source doc/build/pdf
  make -C doc/build/pdf

[testenv:releasenotes]
skip_install = True
deps =
   -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
   -r{toxinidir}/doc/requirements.txt
allowlist_externals =
  rm
commands =
  rm -fr releasenotes/build
  sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[testenv:debug]
commands = oslo_debug_helper {posargs}

[flake8]
show-source = True
# E123 - closing bracket does not match indentation of opening bracket's line
# E125 - continuation line with same indent as next logical line
# E128 - continuation line under-indented for visual indent
# E265 - block comment should start with '# '
# H405 - multi line docstring summary not separated with an empty line
# W503 - line break before binary operator
# W504 - line break after binary operator
ignore = E123,E125,E128,E265,H405,W503,W504
# [H106] Don't put vim configuration in source files.
# [H203] Use assertIs(Not)None to check for None.
# [H904] Delay string interpolations at logging calls.
enable-extensions = H106,H203,H904
builtins = _
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build

[hacking]
import_exceptions = masakarimonitors.i18n

[flake8:local-plugins]
extension =
    M301 = checks:check_explicit_underscore_import
    M302 = checks:no_translate_logs
    M305 = checks:no_log_warn
paths = ./masakarimonitors/hacking

[testenv:bindep]
skip_install = True
deps = bindep
commands = bindep test

[doc8]
# NOTE(yoctozepto): this is due to multiple violations - it is better to keep
# it limited sanely rather than disable the D001 "Line too long" rule altogether
max-line-length = 105
